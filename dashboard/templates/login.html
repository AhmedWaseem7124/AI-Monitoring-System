<!DOCTYPE html>
<html>
<head>
    <title>Login | Crescent Steel AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #003049);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            width: 90px;
            display: block;
            margin: 0 auto 20px;
            background: white;
            padding: 8px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            font-size: 23px;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="/static/images/logo.png" class="logo" onerror="this.style.display='none'">

    <h1>Crescent Steel</h1>
    <p>AI Server Room Monitoring System</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        Enterprise Security Dashboard
    </div>

</div>

</body>
</html>
